name: Deploy Study Guides

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build all guide pages
        run: python build_all_guides.py

      - name: Verify index is fresh
        run: |
          python - <<'PY'
          from pathlib import Path
          from build_all_guides import CATEGORIES

          index = Path("html/index.html")
          if not index.exists():
              raise SystemExit("html/index.html was not generated")

          html = index.read_text(encoding="utf-8")
          expected_pages = [
              page
              for _, pages in CATEGORIES
              for page in pages
              if Path("html", page).exists()
          ]
          missing = [
              page
              for page in expected_pages
              if f'href="{page}"' not in html and f"href='{page}'" not in html
          ]

          if missing:
              raise SystemExit(
                  "html/index.html is missing generated page links:\n"
                  + "\n".join(f"- {page}" for page in missing)
              )

          print(f"html/index.html links to {len(expected_pages)} generated pages")
          PY

      - name: Disable Jekyll processing
        run: touch html/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
